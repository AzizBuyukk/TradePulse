<style>
/* Layout: dark navy sidebar + light main; dashboard = KPI row, win% donuts + cumulative P&L, calendar + score radar */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --surface2:#f7f7fb; --ink:#2b2d48; --muted:#8a8ca6; --line:#e7e8f0;
  --accent:#6c5dd3; --accent-hover:#5d4ec4; --accent-ink:#ffffff; --accent-soft:#eceafb;
  --win:#3fbf9b; --win-text:#2fa985; --win-soft:#e3f6ef; --win-line:#a6e0cd;
  --loss:#ef7376; --loss-text:#e25a5e; --loss-soft:#fde7e7; --loss-line:#f4b1b3;
  --be:#8b84e6; --be-soft:#e9e7fb; --be-line:#c3bef3;
  --side:#25284f; --side-2:#1d2044; --side-ink:#ffffff; --side-muted:#aeb1d0; --side-active:#3b3f6b;
  --chart-line:#6c5dd3; --grid:#eceef4; --brand-pulse:#b8acff;
  --shadow:0 1px 3px rgba(37,40,79,.06);
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07060b; --surface:#110e19; --surface2:#1a1526; --ink:#ece8f7; --muted:#9b91b6; --line:#261f38;
  --accent:#8b5cf6; --accent-hover:#9d74f8; --accent-ink:#ffffff; --accent-soft:#241a40;
  --win:#3fcf9f; --win-text:#52dbac; --win-soft:#0f2a22; --win-line:#1d5141;
  --loss:#f0647a; --loss-text:#f67b8e; --loss-soft:#2e1220; --loss-line:#5c2236;
  --be:#a78bfa; --be-soft:#21183a; --be-line:#43307a;
  --side:#000000; --side-2:#100c18; --side-ink:#ffffff; --side-muted:#9b91b6; --side-active:#1f1734;
  --chart-line:#a78bfa; --grid:#1e182d; --brand-pulse:#a78bfa;
  --shadow:0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(139,92,246,.04); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07060b; --surface:#110e19; --surface2:#1a1526; --ink:#ece8f7; --muted:#9b91b6; --line:#261f38;
  --accent:#8b5cf6; --accent-hover:#9d74f8; --accent-ink:#ffffff; --accent-soft:#241a40;
  --win:#3fcf9f; --win-text:#52dbac; --win-soft:#0f2a22; --win-line:#1d5141;
  --loss:#f0647a; --loss-text:#f67b8e; --loss-soft:#2e1220; --loss-line:#5c2236;
  --be:#a78bfa; --be-soft:#21183a; --be-line:#43307a;
  --side:#000000; --side-2:#100c18; --side-ink:#ffffff; --side-muted:#9b91b6; --side-active:#1f1734;
  --chart-line:#a78bfa; --grid:#1e182d; --brand-pulse:#a78bfa;
  --shadow:0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(139,92,246,.04); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:500}
.pos{color:var(--win-text)} .neg{color:var(--loss-text)}

/* app + sidebar */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 6px}
.brand img{width:38px;height:38px;border-radius:50%;flex:none}
.brand h1{font-family:"Unbounded","Roboto",system-ui,sans-serif;font-size:19px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.brand h1 .a{font-weight:300}
.brand h1 .b{font-weight:700;color:var(--brand-pulse)}
#btn-new{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500}
#btn-new:hover{background:var(--accent-hover)}
.nav{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:6px;font-weight:500;color:var(--side-ink);text-align:left;width:100%;white-space:nowrap;opacity:.85}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:var(--side-active);opacity:1}
.tab[aria-selected="true"]{background:var(--side-active);opacity:1}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.theme{display:flex;background:var(--side-2);border-radius:8px;padding:3px;gap:2px}
.theme button{flex:1;border:0;background:transparent;color:var(--side-muted);padding:7px 4px;border-radius:6px;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px}
.theme button svg{width:14px;height:14px}
.theme button[aria-pressed="true"]{background:var(--side-active);color:var(--side-ink)}
.side-note{font-size:12px;color:var(--side-muted);line-height:1.4;padding:0 4px;overflow-wrap:anywhere}
.side-note b{display:block;color:var(--side-ink);font-weight:500}

.wrap{max-width:1320px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:22px 60px;display:flex;flex-direction:column;gap:16px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:24px;font-weight:500}
.page-h .sub{color:var(--muted);font-size:13px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{margin-right:auto;padding:0}
  #btn-new{width:auto;padding:8px 12px}
  .nav{flex-direction:row;width:100%;overflow-x:auto}
  .tab{width:auto;padding:8px 12px}
  .side-foot{margin-top:0;order:2}
  .side-note{display:none}
}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--loss-text)}
.btn.sm{padding:5px 10px;font-size:13px}
.view{display:flex;flex-direction:column;gap:16px}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;color:var(--muted);background:var(--surface)}
.notice b{color:var(--ink);font-weight:500}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:500}
.card-b{padding:16px 18px}
.hint{color:var(--muted);font-size:12px}
.info{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;font-weight:700;margin-left:4px;vertical-align:1px}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:96px}
.kpi .t{min-width:0}
.kpi .lbl{font-size:13px;color:var(--muted);white-space:nowrap}
.kpi .val{font-family:var(--f-mono);font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi svg{flex:none}
.kpi .split{width:100%;margin-top:10px}
.splitbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--grid)}
.splitbar .w{background:var(--win)} .splitbar .l{background:var(--loss)}
.splitlbl{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;font-family:var(--f-mono)}
.kpi.wide{grid-column:span 1}

/* dashboard grid */
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
.dash2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.dash,.dash2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.donut-b{display:flex;align-items:center;justify-content:center;gap:28px;padding:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:14px}
.legend .it{display:flex;gap:10px;align-items:flex-start}
.legend .sw{width:16px;height:16px;border-radius:3px;margin-top:3px}
.legend b{display:block;font-size:18px;font-weight:500;font-family:var(--f-mono)}
.legend span{color:var(--muted);font-size:12px}
.ctabs{display:flex;gap:22px}
.ctab{border:0;background:transparent;padding:4px 0 10px;margin-bottom:-15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.ctab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.axis{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.gridl{stroke:var(--grid);stroke-width:1}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:500;margin-bottom:4px}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h .m{font-size:18px;font-weight:500;min-width:130px}
.navbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.navbtn:hover{color:var(--ink);border-color:var(--muted)}
.mstats{font-size:13px;color:var(--muted)}
.mstats b{font-family:var(--f-mono);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.95fr);gap:5px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;border:1px solid var(--line);border-radius:4px;background:var(--surface2)}
.day{aspect-ratio:1/0.9;max-width:100%;border-radius:4px;background:var(--surface2);border:1px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;min-width:0;text-align:right}
.day.out{opacity:.35}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day .d{color:var(--muted);font-size:11px;line-height:1.2}
.day .body{margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;min-width:0}
.day .p{font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .c{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.day.w{background:var(--win-soft);border-color:var(--win-line)} .day.w .p{color:var(--win-text)}
.day.l{background:var(--loss-soft);border-color:var(--loss-line)} .day.l .p{color:var(--loss-text)}
.day.b{background:var(--be-soft);border-color:var(--be-line)} .day.b .p{color:var(--be)}
.day.has{cursor:pointer}
.day.has:hover{filter:brightness(.97)}
.week{border-radius:4px;border:1px solid var(--line);background:var(--surface);padding:5px 7px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.week .wl{font-size:10px;color:var(--muted)}
.week .wp{font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .wd{font-size:10px;color:var(--muted);white-space:nowrap}
.week .wd span{background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:3px}
@media (max-width:640px){.day .c{display:none}.day .p{font-size:10px}.week .wd{display:none}.week .wp{font-size:10px}.cal{gap:3px}}

/* score */
.score-b{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 18px}
.score-b svg{width:100%;max-width:280px;height:auto}
.radar-lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.score-row{display:flex;justify-content:space-between;align-items:center;width:100%}
.score-row .big{font-family:var(--f-mono);font-size:30px;font-weight:600}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.04em}
.badge.g{background:var(--win-soft);color:var(--win-text)} .badge.m{background:var(--be-soft);color:var(--be)} .badge.bd{background:var(--loss-soft);color:var(--loss-text)}
.scale{width:100%;position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#ef7376,#f4b860 40%,#f2d75c 55%,#3fbf9b)}
.scale .mk{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.scale-n{display:flex;justify-content:space-between;width:100%;font-size:10px;color:var(--muted);font-family:var(--f-mono)}

/* insights */
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.ins{grid-template-columns:minmax(0,1fr)}}
.ins .card{padding:14px 18px}
.ins .k{font-size:12px;color:var(--muted)}
.ins .v{font-size:17px;font-weight:500;margin-top:6px}
.ins .s{color:var(--muted);font-size:13px;margin-top:2px}

/* pills + table */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface2);border:1px solid var(--line)}
.pill.Win{background:var(--win-soft);color:var(--win-text);border-color:transparent}
.pill.Loss{background:var(--loss-soft);color:var(--loss-text);border-color:transparent}
.pill.BE{background:var(--be-soft);color:var(--be);border-color:transparent}
.pill.ex{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.dir{font-weight:700;font-size:12px}
.dir.Long{color:var(--win-text)} .dir.Short{color:var(--loss-text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:60px}
.filters input[type=search]{flex:1 1 200px;width:auto}
.filters select{width:auto;flex:0 1 auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td.rr,th.rr{text-align:right}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.thumbdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;padding:12px 18px;font-size:13px;color:var(--muted)}
.sumbar b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}

/* reports */
.rep-tabs{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar-row{display:grid;grid-template-columns:minmax(110px,1.2fr) 48px 56px minmax(120px,2fr) 90px 64px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.bar-row.head{font-size:12px;color:var(--muted);font-weight:500}
.bar-row:last-child{border-bottom:0}
.bar-row .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--surface2);border-radius:3px}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.5}
.track .fill{position:absolute;top:2px;bottom:2px;border-radius:2px}
.fill.p{background:var(--win)} .fill.n{background:var(--loss)}
@media (max-width:620px){.bar-row{grid-template-columns:minmax(0,1fr) 36px 46px 76px}.bar-row .track-cell,.bar-row .rcol{display:none}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,16,38,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:880px;box-shadow:0 20px 50px rgba(15,16,38,.3)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-h h2{font-size:18px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:22px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.modal-f .err{color:var(--loss-text);margin-right:auto;font-size:13px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{font-weight:500;font-size:15px;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
legend .step{font-family:var(--f-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:4px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 8px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].lng{background:var(--win);color:#fff}
.seg button[aria-pressed="true"].sht{background:var(--loss);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip.bad[aria-pressed="true"]{background:var(--loss-soft);border-color:var(--loss);color:var(--loss-text)}
.calc{font-size:12px;color:var(--muted)}
.calc b{font-family:var(--f-mono);color:var(--ink)}
.emo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.emo{grid-template-columns:minmax(0,1fr)}}
.emo .phase{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface2)}
.emo .phase h3{font-size:14px}
.emo .phase .when{font-size:11px;color:var(--muted)}
.score{display:flex;gap:6px}
.score button{width:36px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.score button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.shots{grid-template-columns:minmax(0,1fr)}}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--surface2);min-width:0}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.active{border-color:var(--accent)}
.drop .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.drop .dh b{font-weight:700}
.drop .dh span{font-size:11px;color:var(--muted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:110px;max-width:100%;aspect-ratio:16/10;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.drop .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.drop .actions .hint{font-size:11px}
.uploading{font-size:12px;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;box-shadow:-10px 0 40px rgba(15,16,38,.2);padding:max(16px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.drawer-bg{position:fixed;inset:0;z-index:20;background:rgba(15,16,38,.4)}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dr-h h2{font-size:22px}
.dr-h .meta{color:var(--muted);font-size:13px;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r)}
.kv div{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kv div:nth-child(4n){border-right:0}
.kv div:nth-last-child(-n+4){border-bottom:0}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
@media (max-width:480px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}.kv div:nth-child(2n){border-right:0}.kv div:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.kv div:nth-last-child(-n+2){border-bottom:0}}
.sec h3{font-size:12px;font-weight:500;margin-bottom:8px;color:var(--muted)}
.emo-line{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.emo-line:last-child{border-bottom:0}
.emo-line .ph{font-size:12px;color:var(--muted)}
.emo-line .note{grid-column:2;color:var(--muted);font-size:13px;white-space:pre-wrap}
.bigshots{display:flex;flex-direction:column;gap:12px}
.bigshot{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bigshot .cap{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:6px 10px;background:var(--surface2);border-bottom:1px solid var(--line)}
.bigshot img{display:block;width:100%;cursor:zoom-in}
.prose{white-space:pre-wrap;max-width:65ch}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(5,6,16,.9);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.confirm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}.modal{animation:rise .18s ease-out}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:var(--side-ink);padding:9px 16px;border-radius:6px;z-index:40;font-weight:500;font-size:13px}
</style>

<script>
(() => {
"use strict";
const SESSIONS=["New York Open","London Open","Asia","Diğer"];
const INSTR=["NQ","ES","EURUSD","GBPUSD","XAUUSD","BTCUSD"];
const SETUPS=["FVG","Order Block","Liquidity Sweep","MSS / CHoCH","Breaker","Turtle Soup","OTE","Silver Bullet"];
const MISTAKES=["Erken giriş","Geç giriş","Kurala uymadım","Stopu oynattım","Erken çıktım","Aşırı risk","Setup yoktu","FOMO işlemi","İntikam işlemi"];
const EMO_IN=["Sakin","Kendinden emin","Heyecanlı","FOMO","Acele","Korku","İntikam isteği","Kararsız"];
const EMO_DURING=["Sakin","Stresli","Erken kapatma isteği","Stopu oynatma isteği","Açgözlülük","Panik","Umut"];
const EMO_AFTER=["Memnun","Rahatlama","Pişmanlık","Öfke","Hayal kırıklığı","Tarafsız"];
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DOW=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const WEEKDAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

let trades=[], loaded=false;
let view="panel", calY, calM, reportBy="setup", chartMode="cum";
{const n=new Date(); calY=n.getFullYear(); calM=n.getMonth();}
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
{const v=ls.get("sd-view"); if(["panel","log","reports"].includes(v)) view=v; const rb=ls.get("sd-rep"); if(rb) reportBy=rb; const cm=ls.get("sd-chart"); if(cm==="daily") chartMode="daily";}

/* theme */
function applyTheme(t){
  const root=document.documentElement;
  if(t==="light"||t==="dark") root.setAttribute("data-theme",t); else root.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===(t||"system"))));
}
applyTheme(ls.get("sd-theme")||"system");

/* helpers */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return Number.isFinite(n)?n:null;};
const sign=v=>v>0?"+":v<0?"−":"";
const fmtR=(r,d=2)=>r==null?"—":sign(r)+Math.abs(r).toFixed(d)+"R";
const fmtUsd=(v,d=2)=>v==null?"—":(v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtUsdS=v=>v==null?"—":(v>0?"+":"")+fmtUsd(v);
const fmtK=v=>{if(v==null)return"—";const a=Math.abs(v);const s=v<0?"−":"";return s+"$"+(a>=1000?(a/1000).toFixed(a>=10000?1:2).replace(/\.?0+$/,"")+"K":a.toFixed(a%1?1:0));};
const fmtPct=p=>p==null?"—":(p*100).toFixed(p===1||p===0?0:1).replace(/\.0$/,"")+"%";
const cls=r=>r==null?"":r>0?"pos":r<0?"neg":"";
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtDate=s=>{if(!s)return"—";const[y,m,d]=s.split("-").map(Number);return d+" "+MONTHS[m-1].slice(0,3)+" "+y;};
const shortDate=s=>{const[y,m,d]=s.split("-");return d+"."+m;};
const imgUrl=id=>"/_img/"+encodeURIComponent(id);
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);}

function calcR(t){const e=num(t.entry),s=num(t.stop),x=num(t.exit);if(e==null||s==null||x==null||e===s)return null;return (t.direction==="Short"?e-x:x-e)/Math.abs(e-s);}
function plannedRR(t){const e=num(t.entry),s=num(t.stop),g=num(t.target);if(e==null||s==null||g==null||e===s)return null;return Math.abs(g-e)/Math.abs(e-s);}
function rOf(t){const r=num(t.r);return r!=null?r:calcR(t);}
function pnlOf(t){const p=num(t.pnl);if(p!=null)return p;const r=rOf(t),k=num(t.riskUsd);return r!=null&&k!=null?r*k:null;}
function resOf(t){
  if(t.result&&t.result!=="auto")return t.result;
  const r=rOf(t);
  if(r!=null)return r>0.05?"Win":r<-0.05?"Loss":"BE";
  const p=num(t.pnl); if(p!=null)return p>0?"Win":p<0?"Loss":"BE";
  return null;
}
const sortTrades=a=>a.slice().sort((x,y)=>((y.date||"")+(y.time||"")).localeCompare((x.date||"")+(x.time||""))||(y.createdAt||0)-(x.createdAt||0));

function summarize(list){
  const o={n:0,w:0,l:0,b:0,sumR:0,sumP:0,hasP:0,gpP:0,glP:0,wsP:0,lsP:0,gpR:0,glR:0,rules:0,rn:0};
  for(const t of list){
    const r=rOf(t),p=pnlOf(t),res=resOf(t);
    if(res){o.n++; if(res==="Win")o.w++; else if(res==="Loss")o.l++; else o.b++;}
    if(r!=null){o.sumR+=r; if(r>0)o.gpR+=r; else o.glR-=r;}
    if(p!=null){o.hasP++;o.sumP+=p; if(p>0){o.gpP+=p;o.wsP++;} else if(p<0){o.glP-=p;o.lsP++;}}
    const sc=num(t.rules); if(sc){o.rules+=sc;o.rn++;}
  }
  o.wr=(o.w+o.l)?o.w/(o.w+o.l):null;
  o.pf=o.hasP?(o.glP?o.gpP/o.glP:(o.gpP?Infinity:null)):(o.glR?o.gpR/o.glR:(o.gpR?Infinity:null));
  o.avgW=o.wsP?o.gpP/o.wsP:null; o.avgL=o.lsP?-o.glP/o.lsP:null;
  o.ratio=o.avgW!=null&&o.avgL?o.avgW/Math.abs(o.avgL):null;
  o.rulesAvg=o.rn?o.rules/o.rn:null;
  return o;
}
function dayMap(list=trades){
  const m={};
  for(const t of list){if(!t.date)continue;const b=m[t.date]||(m[t.date]={p:0,hasP:false,r:0,hasR:false,n:0,w:0,l:0});b.n++;
    const p=pnlOf(t),r=rOf(t),res=resOf(t); if(p!=null){b.p+=p;b.hasP=true;} if(r!=null){b.r+=r;b.hasR=true;} if(res==="Win")b.w++; else if(res==="Loss")b.l++;}
  return m;
}
const dayVal=b=>b.hasP?b.p:b.hasR?b.r:0;
function daySummary(){const m=dayMap();let w=0,l=0,b=0;for(const k in m){const v=dayVal(m[k]);if(v>0)w++;else if(v<0)l++;else b++;}return{w,l,b,n:w+l+b,wr:(w+l)?w/(w+l):null};}

/* boot: Python tarafı (window.pywebview.api) ile SQL Server */
const TOKEN=new URLSearchParams(location.search).get("t")||"";
async function call(name,...args){
  try{
    const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json","X-Token":TOKEN},body:JSON.stringify({args})});
    if(!r.ok)return {ok:false,error:"Uygulama sunucusu hata verdi ("+r.status+")."};
    return await r.json();
  }catch(e){return {ok:false,error:"Uygulama sunucusuna ulaşılamadı. TradePulse'u kapatıp yeniden aç."};}
}
const API={status:()=>call("status"),set_server:s=>call("set_server",s),list_trades:()=>call("list_trades"),save_trade:t=>call("save_trade",t),delete_trade:id=>call("delete_trade",id),save_image:d=>call("save_image",d),open_images_folder:()=>call("open_images_folder")};
const api=()=>API;
function waitApi(){return Promise.resolve(location.protocol.startsWith("http"));}
setInterval(()=>call("ping"),10000);
async function boot(){
  render();
  if(!(await waitApi())){loaded=true;status("<b>Uygulama arka ucu bulunamadı.</b> Bu sayfayı tarayıcıda değil, TradePulse.bat veya TradePulse.exe ile aç.");render();return;}
  const st=await api().status();
  showDb(st);
  if(!st.ok){loaded=true;dbError(st);render();return;}
  await reload();
}
async function reload(){
  const r=await api().list_trades();
  if(!r.ok){status(`<b>Kayıtlar okunamadı.</b> ${esc(r.error)}`);loaded=true;render();return;}
  trades=r.trades;loaded=true;status(null);render();refreshDrawer();
}
function showDb(st){const el=$("#dbinfo");if(!el)return;el.innerHTML=st&&st.ok?`<b>SQL Server</b>${esc(st.server)} · ${esc(st.database)}`:`<b>SQL Server</b>bağlı değil`;}
function dbError(st){
  status(`<b>SQL Server'a bağlanılamadı.</b> Sunucu adını SSMS'te bağlanırken kullandığın adla aynı yaz (örneğin <code>localhost</code> veya <code>localhost\\SQLEXPRESS</code>).
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="srv-name" value="${esc(st.server&&st.server!=="auto"?st.server:"localhost")}" style="max-width:280px"><button class="btn primary sm" id="srv-connect">Bağlan</button></div>
    <details style="margin-top:8px"><summary>Hata ayrıntısı</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(st.error)}</pre></details>`);
}
function status(html){const el=$("#status");if(!html){el.hidden=true;return;}el.innerHTML=html;el.hidden=false;}
async function saveTrade(t){
  const r=await api().save_trade(t);
  if(!r.ok)throw new Error(r.error);
  await reload();
}
async function deleteTrade(id){
  const r=await api().delete_trade(id);
  if(!r.ok)throw new Error(r.error);
  await reload();
}

function emptyHTML(){

}

/* svg widgets */
function semiGauge(frac,size=74){
  const p=frac==null?0:Math.max(0,Math.min(1,frac))*100;
  return `<svg width="${size}" height="${size*0.6}" viewBox="0 0 80 46" aria-hidden="true"><path d="M8 42 A32 32 0 0 1 72 42" fill="none" stroke="var(--loss)" stroke-width="8" stroke-linecap="round" pathLength="100"/>${frac==null?`<path d="M8 42 A32 32 0 0 1 72 42" fill="none" stroke="var(--grid)" stroke-width="8" stroke-linecap="round"/>`:`<path d="M8 42 A32 32 0 0 1 72 42" fill="none" stroke="var(--win)" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="${p.toFixed(1)} 100"/>`}</svg>`;
}
function ring(frac,size=56){
  const r=22,c=2*Math.PI*r,p=frac==null?0:Math.max(0,Math.min(1,frac));
  return `<svg width="${size}" height="${size}" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" fill="none" stroke="${frac==null?"var(--grid)":"var(--loss)"}" stroke-width="7"/>${frac==null?"":`<circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--win)" stroke-width="7" stroke-dasharray="${(p*c).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 28 28)"/>`}</svg>`;
}
function donut(w,l,label){
  const tot=w+l, r=62, c=2*Math.PI*r, gap=tot&&w&&l?6:0;
  const wf=tot?w/tot:0, wl=Math.max(0,wf*c-gap), ll=Math.max(0,(1-wf)*c-gap);
  const pct=tot?Math.round(wf*100):null;
  const svg=`<svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="${label}: ${pct??"veri yok"}%">
    ${tot?`<circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--win)" stroke-width="11" stroke-dasharray="${wl.toFixed(2)} ${c.toFixed(2)}" transform="rotate(${-90+ (gap/2)/c*360} 85 85)"/>
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--loss)" stroke-width="11" stroke-dasharray="${ll.toFixed(2)} ${c.toFixed(2)}" transform="rotate(${-90+wf*360+(gap/2)/c*360} 85 85)"/>`:`<circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--grid)" stroke-width="11"/>`}
    <text x="85" y="88" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="34" font-weight="600" fill="var(--win-text)">${pct??"—"}<tspan font-size="14" dx="3">${pct!=null?"%":""}</tspan></text>
    <text x="85" y="110" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="var(--win-text)">WIN RATE</text></svg>`;
  return `<div class="donut-b">${svg}<div class="legend"><div class="it"><span class="sw" style="background:var(--win)"></span><div><b>${w}</b><span>kazanan</span></div></div><div class="it"><span class="sw" style="background:var(--loss)"></span><div><b>${l}</b><span>kaybeden</span></div></div></div></div>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function axisFmt(v,useP){return useP?fmtK(Math.abs(v)<1e-9?0:v):(Math.abs(v)<1e-9?"0":(+v.toFixed(1))+"R");}

/* panel */
function renderPanel(){
  const s=summarize(trades), dsum=daySummary(), useP=s.hasP>0;
  const net=useP?s.sumP:(s.n?s.sumR:null);
  const kpi=(lbl,tip,val,sub,c,vis)=>`<div class="card kpi"><div class="t"><div class="lbl">${lbl}<span class="info" title="${tip}">i</span></div><div class="val ${c||""}">${val}</div><div class="sub">${sub}</div></div>${vis||""}</div>`;
  const ratioVis=s.avgW!=null||s.avgL!=null?(()=>{const a=s.avgW||0,b=Math.abs(s.avgL||0),t=a+b||1;return `<div class="split"><div class="splitbar"><div class="w" style="width:${a/t*100}%"></div><div class="l" style="width:${b/t*100}%"></div></div><div class="splitlbl"><span class="pos">${fmtUsd(s.avgW)}</span><span class="neg">${fmtUsd(s.avgL)}</span></div></div>`;})():"";
  $("#kpis").innerHTML=
    kpi("Net P&L","Tüm işlemlerin toplam kâr/zararı",useP?fmtUsd(net):fmtR(net),`${s.n} işlem${useP?` · ${fmtR(s.sumR)}`:""}`,cls(net))+
    kpi("İşlem win %","Kazanan / (kazanan + kaybeden). BE sayılmaz.",fmtPct(s.wr),`${s.w}W · ${s.l}L · ${s.b}BE`,"",semiGauge(s.wr))+
    kpi("Profit factor","Toplam kazanç / toplam kayıp",s.pf==null?"—":s.pf===Infinity?"∞":s.pf.toFixed(2),"kazanç ÷ kayıp","",ring(s.pf==null?null:s.pf===Infinity?1:s.gpP/((s.gpP+s.glP)||1)))+
    kpi("Gün win %","Kârlı gün / işlem yapılan gün",fmtPct(dsum.wr),`${dsum.w} kârlı · ${dsum.l} zararlı gün`,"",semiGauge(dsum.wr))+
    `<div class="card kpi" style="flex-direction:column;align-items:stretch"><div class="t"><div class="lbl">Ort. kazanç / kayıp<span class="info" title="Ortalama kazanan işlem ÷ ortalama kaybeden işlem">i</span></div><div class="val">${s.ratio==null?"—":s.ratio.toFixed(2)}</div></div>${ratioVis}</div>`;
  $("#donut-trades").innerHTML=donut(s.w,s.l,"İşlem bazında kazanma");
  $("#donut-days").innerHTML=donut(dsum.w,dsum.l,"Gün bazında kazanma");
  document.querySelectorAll(".ctab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.chart===chartMode)));
  renderChart(); renderCal(); renderScore(s,dsum); renderInsights();
  const rec=sortTrades(trades).slice(0,6);
  $("#recent").innerHTML=rec.length?tableHTML(rec):emptyHTML();
}

function renderChart(){
  const box=$("#chart"), m=dayMap(), days=Object.keys(m).sort();
  const useP=trades.some(t=>pnlOf(t)!=null);
  if(!days.length){box.innerHTML=emptyHTML();$("#chart-hint").textContent="";return;}
  const vals=days.map(d=>useP?m[d].p:m[d].r);
  const W=680,H=300,pl=58,pr=14,pt=14,pb=40;
  let series,mn,mx;
  if(chartMode==="cum"){let c=0;series=vals.map(v=>c+=v);}else series=vals;
  mn=Math.min(0,...series);mx=Math.max(0,...series);if(mx-mn<1e-9){mx+=1;mn-=1;}
  const step=niceStep((mx-mn)/4);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const iw=W-pl-pr, n=series.length;
  const x=i=>chartMode==="cum"?pl+(n===1?iw/2:iw*i/(n-1)):pl+iw*(i+.5)/n;
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g="";for(let v=mn;v<=mx+1e-9;v+=step){const yy=y(v).toFixed(1);g+=`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="axis" x="${pl-8}" y="${(+yy+3).toFixed(1)}" text-anchor="end">${axisFmt(v,useP)}</text>`;}
  const idx=n<=6?[...Array(n).keys()]:[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1];
  const xl=idx.map(i=>`<text class="axis" x="${x(i).toFixed(1)}" y="${H-pb+18}" text-anchor="middle">${shortDate(days[i])}</text>`).join("");
  const z=y(0);
  let body="";
  if(chartMode==="cum"){
    const pts=series.map((v,i)=>[x(i),y(v)]);
    if(n===1)pts.unshift([pl,z]);
    const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${z.toFixed(1)} L${pts[0][0].toFixed(1)} ${z.toFixed(1)} Z`;
    body=`<defs><linearGradient id="gw" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--win)" stop-opacity=".75"/><stop offset="1" stop-color="var(--win)" stop-opacity=".08"/></linearGradient>
      <linearGradient id="gl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--loss)" stop-opacity=".08"/><stop offset="1" stop-color="var(--loss)" stop-opacity=".7"/></linearGradient>
      <clipPath id="ca"><rect x="0" y="0" width="${W}" height="${z.toFixed(1)}"/></clipPath><clipPath id="cb"><rect x="0" y="${z.toFixed(1)}" width="${W}" height="${(H-z).toFixed(1)}"/></clipPath></defs>
      <path d="${area}" fill="url(#gw)" clip-path="url(#ca)"/><path d="${area}" fill="url(#gl)" clip-path="url(#cb)"/>
      <path d="${line}" fill="none" stroke="var(--chart-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4" fill="var(--chart-line)"/>`;
    $("#chart-hint").textContent="Toplam: "+(useP?fmtUsdS(series[n-1]):fmtR(series[n-1]));
  }else{
    const bw=Math.min(28,iw/n*.6);
    body=series.map((v,i)=>{const y1=y(Math.max(v,0)),y2=y(Math.min(v,0));return `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" rx="2" fill="${v>=0?"var(--win)":"var(--loss)"}"><title>${fmtDate(days[i])}: ${useP?fmtUsdS(v):fmtR(v)}</title></rect>`;}).join("");
    $("#chart-hint").textContent=n+" işlem günü";
  }
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${chartMode==="cum"?"Günlük kümülatif P&L":"Günlük net P&L"} grafiği">${g}<line x1="${pl}" x2="${W-pr}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>${body}${xl}</svg>`;
}

function renderCal(){
  $("#cal-title").textContent=MONTHS[calM]+" "+calY;
  const m=dayMap(), useP=trades.some(t=>pnlOf(t)!=null);
  const fmtV=v=>useP?fmtK(v):fmtR(v,1);
  const first=new Date(calY,calM,1), off=(first.getDay()+6)%7, start=new Date(calY,calM,1-off), today=todayStr();
  let h=DOW.map(d=>`<div class="dow">${d}</div>`).join("")+`<div class="dow">Hafta</div>`;
  let mTot=0,mDays=0,wk=0;
  for(let w=0;w<6;w++){
    const ws=new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7);
    if(w>=4&&ws.getMonth()!==calM&&ws>first)break;
    let wTot=0,wDays=0;
    for(let i=0;i<7;i++){
      const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i), k=ds(d), info=m[k], inM=d.getMonth()===calM;
      let c="day"+(inM?"":" out")+(k===today?" today":"");
      let inner=`<span class="d">${d.getDate()}</span>`;
      if(info){const v=dayVal(info);c+=" has "+(v>0?"w":v<0?"l":"b");
        const wr=(info.w+info.l)?fmtPct(info.w/(info.w+info.l)):"—";
        inner+=`<span class="body"><span class="p">${fmtV(v)}</span><span class="c">${info.n} işlem</span><span class="c">${wr}</span></span>`;
        if(inM){wTot+=v;wDays++;mTot+=v;mDays++;}}
      h+=`<div class="${c}" ${info?`data-day="${k}" role="button" tabindex="0" aria-label="${fmtDate(k)}: ${info.n} işlem"`:""}>${inner}</div>`;
    }
    wk++;
    h+=`<div class="week"><span class="wl">Hafta ${wk}</span><span class="wp ${cls(wDays?wTot:null)}">${wDays?fmtV(wTot):"—"}</span><span class="wd"><span>${wDays} gün</span></span></div>`;
  }
  $("#cal").innerHTML=h;
  $("#mstats").innerHTML=`Aylık: <b class="${cls(mDays?mTot:null)}">${mDays?(useP?fmtUsdS(mTot):fmtR(mTot)):"—"}</b> · ${mDays} gün`;
}

function renderScore(s,dsum){
  const box=$("#score");
  if(s.n<1){box.innerHTML=`<div class="empty"><b>Skor için işlem gerekli</b>Birkaç işlem girince puanın burada çıkar.</div>`;return;}
  const clamp=v=>Math.max(0,Math.min(100,v));
  const axes=[
    ["Win %",clamp((s.wr??0)*100)],
    ["Profit factor",clamp(s.pf==null?0:s.pf===Infinity?100:s.pf/2.5*100)],
    ["Kazanç/kayıp",clamp(s.ratio==null?(s.avgW!=null?100:0):s.ratio/2.5*100)],
    ["Gün win %",clamp((dsum.wr??0)*100)],
    ["Kurala uyum",clamp(s.rulesAvg==null?0:(s.rulesAvg-1)/4*100)],
  ];
  const score=axes.reduce((a,b)=>a+b[1],0)/axes.length;
  const cx=140,cy=112,R=78,N=axes.length;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f];};
  let grid="";for(const f of [.25,.5,.75,1]){grid+=`<polygon points="${axes.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${f===1?"var(--surface2)":"none"}" stroke="var(--line)"/>`;}
  const spokes=axes.map((_,i)=>{const[p,q]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${p.toFixed(1)}" y2="${q.toFixed(1)}" stroke="var(--line)"/>`;}).join("");
  const poly=axes.map((a,i)=>pt(i,Math.max(.03,a[1]/100)).map(v=>v.toFixed(1)).join(",")).join(" ");
  const labels=axes.map((a,i)=>{const[p,q]=pt(i,1.2);const anc=Math.abs(p-cx)<5?"middle":p>cx?"start":"end";return `<text class="radar-lbl" x="${p.toFixed(1)}" y="${(q+3).toFixed(1)}" text-anchor="${anc}">${a[0]}</text>`;}).join("");
  const badge=score>=70?["g","İYİ"]:score>=45?["m","ORTA"]:["bd","GELİŞTİR"];
  box.innerHTML=`<div class="score-b"><svg viewBox="0 0 280 220" role="img" aria-label="Defter skoru ${score.toFixed(1)}">${grid}${spokes}<polygon points="${poly}" fill="var(--accent)" fill-opacity=".35" stroke="var(--accent)" stroke-width="1.5"/>${labels}</svg>

function groupStats(keyFn,list=trades){
  const g={};for(const t of list){let ks=keyFn(t);if(ks==null||ks==="")continue;if(!Array.isArray(ks))ks=[ks];for(const k of ks)(g[k]||(g[k]=[])).push(t);}
  return Object.entries(g).map(([k,a])=>({k,...summarize(a)}));
}
const metric=x=>x.hasP?x.sumP:x.sumR;
const fmtM=x=>x.hasP?fmtUsdS(x.sumP):fmtR(x.sumR);
function renderInsights(){
  const box=$("#insights"); if(trades.length<2){box.innerHTML="";return;}
  const emo=groupStats(t=>t.emoIn).filter(x=>x.n>0).map(x=>({...x,avg:metric(x)/x.n}));
  const best=emo.slice().sort((a,b)=>b.avg-a.avg)[0],worst=emo.slice().sort((a,b)=>a.avg-b.avg)[0];
  const mis=groupStats(t=>t.mistakes).sort((a,b)=>metric(a)-metric(b))[0];
  const setup=groupStats(t=>t.setups).filter(x=>x.n>0).sort((a,b)=>metric(b)-metric(a))[0];
  const useP=trades.some(t=>pnlOf(t)!=null), fa=v=>useP?fmtUsdS(v):fmtR(v);
  const card=(k,v,s)=>`<div class="card"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="s">${s}</div></div>`;
  box.innerHTML=
    (best&&worst&&best.k!==worst.k?card("Giriş duygusu",`${best.k} iyi, ${worst.k} kötü`,`${esc(best.k)} ile ort. ${fa(best.avg)}, ${esc(worst.k)} ile ort. ${fa(worst.avg)}`):card("Giriş duygusu",best?best.k:"Veri az",best?`ort. ${fa(best.avg)} · ${best.n} işlem`:"Duygu seçerek kaydet"))+
    (mis?card("En pahalı hata",mis.k,`${mis.n} işlemde toplam ${fmtM(mis)}`):card("En pahalı hata","Hata etiketi yok","İşlemlere hata etiketi ekledikçe çıkar"))+
    (setup?card("En kârlı setup",setup.k,`${setup.n} işlem · toplam ${fmtM(setup)} · WR ${fmtPct(setup.wr)}`):card("En kârlı setup","Setup yok","İşlemlere setup seç"));
}

const REPORTS={setup:["Setup",t=>t.setups],emoIn:["Giriş duygusu",t=>t.emoIn],emoDuring:["İşlem sırası duygu",t=>t.emoDuring],emoAfter:["Sonuç duygusu",t=>t.emoAfter],mistakes:["Hata",t=>t.mistakes],session:["Seans",t=>t.session],instrument:["Enstrüman",t=>t.instrument],weekday:["Gün",t=>t.date?WEEKDAYS[new Date(t.date+"T12:00:00").getDay()]:null],rules:["Kurala uyum",t=>t.rules?t.rules+"/5":null],kind:["Paper / Gerçek",t=>t.kind]};

  $("#rep-tabs").innerHTML=Object.entries(REPORTS).map(([k,[lbl]])=>`<button class="chipbtn" data-rep="${k}" aria-pressed="${k===reportBy}">${lbl}</button>`).join("");

  const maxAbs=Math.max(...g.map(x=>Math.abs(metric(x))),1e-4);

    return `<div class="bar-row"><div class="name" title="${esc(x.k)}">${esc(x.k)}</div><div class="num">${x.n}</div><div class="num">${fmtPct(x.wr)}</div><div class="track-cell"><div class="track"><div class="mid"></div>${fill}</div></div><div class="num ${cls(x.sumP)}" style="text-align:right">${x.hasP?fmtUsd(x.sumP,0):"—"}</div><div class="num rcol ${cls(x.sumR)}" style="text-align:right">${fmtR(x.sumR,1)}</div></div>`;}).join("");

  <p class="calc" style="margin:12px 0 0">Win rate BE işlemleri saymaz. Çoklu seçilen alanlarda (setup, hata) bir işlem birden fazla satırda sayılabilir.</p>`;
}

const memSrc=id=>imgUrl(id);

function renderShots(){

async function addFiles(k,files){
  const imgs=[...files].filter(f=>f.type.startsWith("image/"));if(!imgs.length)return;
  activeShot=k;uploadingCount+=imgs.length;renderShots();
  for(const f of imgs){
    try{
      const r=await api().save_image(await readAsDataURL(f));
      if(!r.ok)throw new Error(r.error);
      if(draft)draft[k].push(r.file);
    }catch(e){const er=$("#ferr");if(er)er.textContent=e?.message||"Görsel kaydedilemedi, tekrar dene.";}

    <div class="kv">${kv("Giriş",esc(t.entry||"—"))}${kv("Stop",esc(t.stop||"—"))}${kv("Hedef",esc(t.target||"—"))}${kv("Çıkış",esc(t.exit||"—"))}${kv("Risk $",t.riskUsd?"$"+esc(t.riskUsd):"—")}${kv("Risk %",t.riskPct?esc(t.riskPct)+"%":"—")}${kv("Plan RR",p!=null?"1:"+p.toFixed(2):"—")}${kv("R",fmtR(r))}</div>
    ${(t.setups||[]).length||(t.mistakes||[]).length?`<div class="sec"><h3>Setup ve hatalar</h3><div class="tags">${(t.setups||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join("")}${(t.mistakes||[]).map(s=>`<span class="pill Loss">${esc(s)}</span>`).join("")}</div></div>`:""}
    <div class="sec"><h3>Duygu durumu</h3>${emoL("Girerken",t.emoIn,t.emoInNote)}${emoL("İşlemdeyken",t.emoDuring,t.emoDuringNote)}${emoL("Kapanınca",t.emoAfter,t.emoAfterNote)}</div>
    ${shots.length?`<div class="sec"><h3>Ekran görüntüleri</h3><div class="bigshots">${shots.map(([c,i])=>`<div class="bigshot"><div class="cap">${c}</div><img src="${esc(memSrc(i))}" alt="${c} grafik" data-zoom="${esc(memSrc(i))}" loading="lazy"></div>`).join("")}</div></div>`:""}
    ${t.notes?`<div class="sec"><h3>Not</h3><div class="prose">${esc(t.notes)}</div></div>`:""}
    ${t.lesson?`<div class="sec"><h3>Ders</h3><div class="prose">${esc(t.lesson)}</div></div>`:""}
    <div class="confirm-row" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--line)">
      <button class="btn primary" data-edit="${esc(t.id)}">Düzenle</button>
      ${confirmDel?`<span>Bu işlem ve görselleri silinsin mi?</span><button class="btn danger" data-del-yes="${esc(t.id)}">Evet, sil</button><button class="btn ghost" data-del-no>Vazgeç</button>`:`<button class="btn ghost danger" data-del="${esc(t.id)}">Sil</button>`}
    </div></aside>`;
  document.body.style.overflow="hidden";
}

/* events */
document.addEventListener("click",async e=>{
  const el=e.target.closest("button,[data-day],[data-open],[data-zoom],[data-dclose]");
  if(!el)return;
  if(el.dataset.themeSet){ls.set("sd-theme",el.dataset.themeSet);applyTheme(el.dataset.themeSet);return;}
  if(el.id==="open-imgs"){if(api())api().open_images_folder();return;}
  if(el.id==="srv-connect"){el.disabled=true;el.textContent="Bağlanıyor…";const st=await api().set_server($("#srv-name").value.trim());showDb(st);if(st.ok){toast("SQL Server'a bağlandı");await reload();}else{dbError(st);}return;}
  if(el.matches(".tab"))return setView(el.dataset.view);
  if(el.dataset.goto)return setView(el.dataset.goto);
  if(el.id==="btn-new"||el.hasAttribute("data-new"))return openForm(null);
  if(el.dataset.chart){chartMode=el.dataset.chart;ls.set("sd-chart",chartMode);document.querySelectorAll(".ctab").forEach(b=>b.setAttribute("aria-selected",String(b===el)));return renderChart();}
  if(el.id==="cal-prev"){calM--;if(calM<0){calM=11;calY--;}return renderCal();}
  if(el.id==="cal-next"){calM++;if(calM>11){calM=0;calY++;}return renderCal();}
  if(el.id==="cal-today"){const n=new Date();calY=n.getFullYear();calM=n.getMonth();return renderCal();}
  if(el.dataset.day){const day=trades.filter(t=>t.date===el.dataset.day);if(day.length===1)return openDrawer(day[0].id);setView("log");$("#q").value="";renderLog();$("#f-month").value=el.dataset.day.slice(0,7);renderLog();return;}
  if(el.dataset.open)return openDrawer(el.dataset.open);
  if(el.dataset.zoom){const lb=document.createElement("div");lb.className="lightbox";lb.innerHTML=`<img src="${esc(el.dataset.zoom)}" alt="Büyük görsel">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb);return;}
  if(el.hasAttribute("data-dclose"))return closeDrawer();
  if(el.dataset.edit){return openForm(trades.find(x=>x.id===el.dataset.edit));}
  if(el.dataset.del){confirmDel=true;return drawDrawer();}
  if(el.hasAttribute("data-del-no")){confirmDel=false;return drawDrawer();}
  if(el.dataset.delYes){const id=el.dataset.delYes;closeDrawer();try{await deleteTrade(id);toast("İşlem silindi");}catch(x){toast("Silinemedi, tekrar dene");}return;}
  if(el.id==="clear-ex"){el.disabled=true;el.textContent="Siliniyor…";for(const t of trades.filter(t=>t.example)){try{await deleteTrade(t.id);}catch(x){}}toast("Örnekler silindi");return;}
  if(el.dataset.rep){reportBy=el.dataset.rep;ls.set("sd-rep",reportBy);return renderReports();}
  if(!draft)return;
  if(el.hasAttribute("data-close"))return closeForm();
  if(el.dataset.seg){draft[el.dataset.seg]=el.dataset.val;el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===el)));return updateCalc();}
  if(el.dataset.chip){const f=el.dataset.chip,v=el.dataset.val;
    if(el.dataset.multi==="1"){const a=draft[f]||(draft[f]=[]);const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);el.setAttribute("aria-pressed",String(i<0));}
    else{draft[f]=draft[f]===v?"":v;el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(draft[f]===b.dataset.val)));}
    return;}
  if(el.dataset.score){const n=+el.dataset.score;draft.rules=draft.rules===n?0:n;document.querySelectorAll("[data-score]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.score===draft.rules)));return;}
  if(el.id==="add-setup"){const inp=$("#f-newsetup"),v=inp.value.trim();if(!v)return;if(!draft.setups.includes(v))draft.setups.push(v);
    const ex=[...document.querySelectorAll('[data-chip="setups"]')].find(b=>b.dataset.val===v);
    if(ex)ex.setAttribute("aria-pressed","true");else $("#setup-chips").insertAdjacentHTML("beforeend",`<button type="button" class="chip" data-chip="setups" data-multi="1" data-val="${esc(v)}" aria-pressed="true">${esc(v)}</button>`);
    inp.value="";return;}
  if(el.dataset.rmshot){draft[el.dataset.rmshot].splice(+el.dataset.i,1);return renderShots();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){const lb=$(".lightbox");if(lb)return lb.remove();if(drawerId)return closeDrawer();}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open],[data-day]")){e.preventDefault();e.target.click();}
  if(e.key==="Enter"&&e.target.id==="f-newsetup"){e.preventDefault();$("#add-setup").click();}
});
document.addEventListener("submit",e=>{if(e.target.id==="tf")submitForm(e);});
document.addEventListener("input",e=>{
  if(draft&&e.target.closest("#tf")&&["f-entry","f-stop","f-target","f-exit","f-r","f-pnl","f-riskUsd"].includes(e.target.id))updateCalc();
  if(e.target.id==="q")renderLog();
});
document.addEventListener("change",e=>{
  if(["f-res","f-setup","f-kind","f-month"].includes(e.target.id))renderLog();
  if(e.target.dataset?.file){addFiles(e.target.dataset.file,e.target.files);e.target.value="";}
});
const pickDrop=e=>{const d=e.target.closest?.("[data-drop]");if(d&&draft){activeShot=d.dataset.drop;document.querySelectorAll("[data-drop]").forEach(x=>x.classList.toggle("active",x===d));}};
document.addEventListener("focusin",pickDrop);
document.addEventListener("pointerdown",pickDrop);
document.addEventListener("dragover",e=>{const d=e.target.closest?.("[data-drop]");if(d){e.preventDefault();d.classList.add("over");}});
document.addEventListener("dragleave",e=>{const d=e.target.closest?.("[data-drop]");if(d)d.classList.remove("over");});
document.addEventListener("drop",e=>{const d=e.target.closest?.("[data-drop]");if(d){e.preventDefault();d.classList.remove("over");addFiles(d.dataset.drop,e.dataTransfer.files);}});
document.addEventListener("paste",e=>{
  if(!draft)return;
  const files=[...(e.clipboardData?.items||[])].filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  if(files.length){e.preventDefault();addFiles(activeShot,files);}
});

boot();
})();
</script>

</body>
</html>
